<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YM Campus GO｜陽明智慧校園導覽</title><style>
:root{--ink:#102334;--teal:#17a49b;--yellow:#f6c84c;--cream:#f8f3e9}*{box-sizing:border-box}body{margin:0;background:var(--cream);font-family:Arial,'Noto Sans TC',sans-serif;color:var(--ink)}.hero{padding:26px 5vw 55px;color:white;text-align:center;background:linear-gradient(120deg,#073a4ddd,#0c6c7cbb),url('campus-angle-2.png') center/cover}.brand{font-weight:800;letter-spacing:.12em;text-align:left}.brand b{background:var(--yellow);color:#18313e;border-radius:99px;padding:7px;margin-right:7px}.eyebrow{font-size:12px;letter-spacing:.12em;font-weight:bold;margin:45px 0 9px}.hero h1{font-size:clamp(42px,8vw,74px);letter-spacing:-.07em;line-height:.94;margin:0}.hero p:last-child{opacity:.9}.wrap{max-width:1100px;margin:-28px auto 0;padding:0 18px}.search{height:62px;background:white;box-shadow:0 12px 30px #17364522;border-radius:15px;padding:0 18px;display:flex;align-items:center}.search span{font-size:27px;color:var(--teal)}input{border:0;outline:0;flex:1;padding:10px;font-size:16px}.chips{display:flex;gap:8px;overflow:auto;padding:17px 0}.chips button,.view button{white-space:nowrap;border:1px solid #dbe2df;background:white;color:#49606a;border-radius:99px;padding:8px 13px}.chips button.on{background:var(--ink);color:white}.map{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:20px;box-shadow:0 22px 44px #19364522}.map img{width:100%;height:100%;object-fit:cover}.pin{position:absolute;transform:translate(-50%,-100%);border:0;background:transparent;font-weight:bold;font-size:11px;color:#132d3a}.pin:before{content:'';display:block;margin:auto;width:15px;height:15px;border-radius:50%;background:#ef5a58;border:3px solid white;box-shadow:0 2px 7px #0008}.pin span{display:block;background:white;padding:3px 6px;border-radius:6px;white-space:nowrap;margin-top:3px;box-shadow:0 2px 7px #0003}.pin.on:before{width:22px;height:22px;background:var(--yellow);box-shadow:0 0 0 7px #f6c84c88}.view{position:absolute;top:12px;right:12px;display:flex;gap:5px}.view button{padding:6px 9px;font-size:12px}.view button.on{background:var(--yellow);color:#102334}.hint{position:absolute;left:14px;bottom:13px;background:#102334df;color:white;border-radius:99px;padding:8px 11px;font-size:12px}.tasks{max-width:1100px;margin:55px auto;padding:0 18px;text-align:center}.tasks h2{font-size:31px;margin:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:23px}.task{border:1px solid #e1e3dc;text-align:left;background:white;border-radius:13px;padding:14px;color:var(--ink)}.task small{display:block;color:#64727d;margin:6px 0 0 17px}.task:before{content:'●';color:var(--yellow);margin-right:8px}.sheet{position:fixed;inset:0;background:#0b253a66;display:none;align-items:end;justify-content:center}.sheet.show{display:flex}.card{width:min(560px,100%);border-radius:24px 24px 0 0;background:white;padding:28px}.card .tag{color:var(--teal);font-weight:bold;font-size:12px}.card h2{font-size:38px;margin:8px 0}.facilities span{display:inline-block;background:#eef3f2;border-radius:99px;padding:6px 10px;margin:3px;font-size:13px}.route{border-left:3px solid var(--yellow);padding-left:12px;margin:20px 0;color:#455966;line-height:1.6}.route b{color:var(--ink)}.go{width:100%;border:0;border-radius:12px;background:var(--ink);color:white;padding:14px;font-weight:bold}.close{float:right;border:0;background:none;font-size:24px}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.pin{font-size:8px}.pin:before{width:11px;height:11px;border-width:2px}.map{border-radius:14px}.card h2{font-size:32px}}
</style></head><body><header class="hero"><div class="brand"><b>YM</b> CAMPUS GO</div><p class="eyebrow">臺北市立陽明高中｜智慧校園導覽</p><h1>一掃就懂，<br>一點就到。</h1><p>手機優先的校園地圖，陪你找到每一個重要地點。</p></header><main class="wrap"><label class="search"><span>⌕</span><input id="search" placeholder="搜尋處室、教室或地點，例如：健康中心"></label><div class="chips" id="chips"></div><div class="map"><img id="map" src="campus-overview.png" alt="陽明高中互動校園地圖"><div id="pins"></div><div class="view" id="view"></div><div class="hint">點選建築標記開始導覽</div></div></main><section class="tasks"><p class="eyebrow" style="color:#17a49b;margin:0 0 8px">常用目的地</p><h2>你想去哪裡？</h2><div class="grid" id="tasks"></div></section><div id="sheet" class="sheet"><article class="card"><button class="close" onclick="closeSheet()">×</button><p class="tag" id="type"></p><h2 id="title"></h2><div class="facilities" id="fac"></div><div class="route"><b>從校門出發</b><div id="route"></div><small id="minutes" style="color:#17a49b;font-weight:bold"></small></div><button class="go" onclick="closeSheet()">✦ 在地圖上查看位置</button></article></div><script>
const P=[['行政樓','Administration Building','行政服務',65,49,'教務處、總務處、註冊與課務服務','註冊 課務 教務 行政 成績','從校門進入後直行，穿過前庭即可抵達。',2],['向陽樓','Xiangyang Building','行政服務',66,27,'學務處、教官室、健康中心、軍訓教室、健護教室、高二教室','請假 生病 健康 護理師 學務 教官 高二','從校門進入後往右前方，沿行政樓旁步道前行。',3],['知行館','Zhixing Hall','行政服務',50,42,'輔導室、生涯諮詢、團體輔導空間','輔導 諮商 生涯 心理','從校門直行至活動中心前，向左沿中庭步道前往。',3],['立志樓','Lizhi Building','普通教室',48,19,'國中部教室、員生合作社、普通教室','國中 合作社 文具 用品 教室','從校門往校園中央前進，經行政樓後向左走。',4],['勤學樓','Qinxue Building','普通教室',74,34,'高中部教室、班級教室','高中 高一 高三 班級 教室','從校門進入後右轉，沿右側林蔭道前行。',3],['悅聞樓','Yuewen Building','專科教室',53,8,'圖書館、國中部教師辦公室、閱讀空間','圖書館 借書 閱讀 國中教師 老師','從校門沿中央步道往北，經立志樓後繼續前行。',5],['求真樓','Qiuzhen Building','專科教室',73,10,'專科教室、學習空間','專科 實驗 教室','從校門右轉，沿右側道路前往校園北側。',5],['藝采樓','Yicai Building','專科教室',79,55,'藝術教室、表演與創作空間','藝術 美術 音樂 表演','從校門直行後向右，經行政樓前庭即可抵達。',2],['活動中心','Activity Center','專科教室',55,66,'陽明劇院、演藝廳、大型活動空間','活動 劇院 演藝廳 集合','從校門進入後向左前方走，活動中心就在前方。',2],['台元館','Taiyuan Gymnasium','運動場館',49,34,'室內體育館、球類活動空間','體育 室內 球場 集合','從校門走向活動中心，再沿操場內側步道前往。',4],['漾泉館','Yangquan Pool','運動場館',42,9,'溫水游泳池、游泳課集合處','游泳 泳池 游泳課','從校門往中央步道北行，穿過立志樓旁步道。',5],['操場','Athletic Field','運動場館',27,54,'田徑場、戶外集合區','操場 田徑 跑步 體育課','從校門向左前方前行，沿活動中心外側即可到達。',3]];const V=['campus-overview.png','campus-angle-1.png','campus-angle-2.png','campus-angle-3.png'],C=['全部','行政服務','普通教室','專科教室','運動場館'];let f='全部',q='',chosen=null;const tasks=[['辦理註冊、課務問題',0],['請假、生活管理',1],['身體不舒服',1],['尋求輔導協助',2],['借閱書籍',5],['購買文具、用品',3],['參加大型活動',8],['游泳課',10]];function draw(){chips.innerHTML=C.map(x=>`<button class="${f==x?'on':''}" onclick="f='${x}';draw()">${x}</button>`).join('');pins.innerHTML=P.filter(x=>(f==='全部'||x[2]===f)&&x.join(' ').includes(q)).map((x,i)=>`<button class="pin ${chosen===x?'on':''}" style="left:${x[3]}%;top:${x[4]}%" onclick="show(P.find(y=>y===this._p)||P.filter(y=>y[0]=='${x[0]}')[0])"><span>${x[0]}</span></button>`).join('')}function show(x){chosen=x;type.textContent=x[2]+' · '+x[1];title.textContent=x[0];fac.innerHTML=x[5].split('、').map(y=>'<span>'+y+'</span>').join('');route.textContent=x[7];minutes.textContent='步行約 '+x[8]+' 分鐘';sheet.classList.add('show');draw()}function closeSheet(){sheet.classList.remove('show')}search.oninput=e=>{q=e.target.value;draw()};view.innerHTML=V.map((x,i)=>`<button onclick="map.src='${x}';this.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('on'));this.classList.add('on')" class="${i?'':'on'}">${i+1}</button>`).join('');tasksEl=document.getElementById('tasks');tasksEl.innerHTML=tasks.map(([t,i])=>`<button class="task" onclick="show(P[${i}])">${t}<small>${P[i][0]}</small></button>`).join('');draw();sheet.onclick=e=>{if(e.target===sheet)closeSheet()};
</script></body></html>
